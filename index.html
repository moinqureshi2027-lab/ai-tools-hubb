<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <meta name="description" content="AI Tools Hubb — Premium VPN, AI and editing tool subscriptions at Pakistani prices. Instant delivery, 25–30 days replacement warranty, order on WhatsApp." />
    <link rel="icon" href="data:," />
    <title>AI Tools Hubb — Premium Digital Tools, Pakistani Prices</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&display=swap" rel="stylesheet" />
    <style>
      :root {
        color-scheme: dark;
        --bg: #060b16;
        --surface: #0c1526;
        --surface-2: #111e36;
        --text: #e8f0fa;
        --dim: #8ca3bf;
        --border: #1d2c47;
        --accent: #22d3ee;
        --accent-2: #10b981;
        --radius: 16px;
        --font-display: "Sora", system-ui, sans-serif;
      }
      * { box-sizing: border-box; }
      html { -webkit-text-size-adjust: 100%; }
      body {
        margin: 0;
        color: var(--text);
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        -webkit-tap-highlight-color: transparent;
        background:
          radial-gradient(120% 55% at 50% -10%, rgba(34, 211, 238, 0.10), transparent 60%),
          radial-gradient(90% 45% at 88% 0%, rgba(16, 185, 129, 0.06), transparent 55%),
          var(--bg);
        min-height: 100vh;
      }
      button, [role="button"], select, input:not([type="checkbox"], [type="radio"]) { min-height: 2.25rem; }
      button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; }
      a { color: inherit; }
      .font-display { font-family: var(--font-display); }
      .wrap { max-width: 42rem; margin: 0 auto; padding: 0 1rem; }
      main.wrap { padding-top: 1rem; padding-bottom: 7rem; }
      .hidden { display: none !important; }

      /* ---------- 3D design system ---------- */
      .card-3d {
        background: linear-gradient(165deg, #17293f 0%, var(--surface) 52%, #0a1322 100%);
        border: 1px solid #2a4066;
        box-shadow: inset 0 1px 0 rgba(255,255,255,.09), inset 0 -1px 0 rgba(0,0,0,.4), 0 12px 24px rgba(0,0,0,.45), 0 3px 8px rgba(0,0,0,.35);
      }
      .tile-3d {
        background: linear-gradient(165deg, #1a2c47 0%, var(--surface-2) 60%, #0d1930 100%);
        border: 1px solid #2a4066;
        box-shadow: inset 0 1px 0 rgba(255,255,255,.08), 0 6px 14px rgba(0,0,0,.35);
      }
      .hero-3d {
        background:
          radial-gradient(120% 140% at 15% 0%, rgba(34,211,238,.22), transparent 55%),
          radial-gradient(100% 120% at 95% 10%, rgba(16,185,129,.14), transparent 50%),
          linear-gradient(160deg, #1a2f52 0%, #0e1a30 55%, #0a1322 100%);
        border: 1px solid #2f4d7d;
        box-shadow: inset 0 1px 0 rgba(255,255,255,.12), inset 0 -1px 0 rgba(0,0,0,.4), 0 16px 32px rgba(0,0,0,.5), 0 10px 30px rgba(34,211,238,.10);
      }
      .btn-3d { transition: transform .08s ease, box-shadow .08s ease, filter .15s ease; }
      .btn-3d-cyan {
        color: #04222b;
        background: linear-gradient(180deg, #7deefc 0%, #22d3ee 45%, #0bb3d6 100%);
        box-shadow: inset 0 1px 0 rgba(255,255,255,.55), inset 0 -1px 0 rgba(0,0,0,.15), 0 4px 0 #0a6d88, 0 10px 18px rgba(34,211,238,.28);
      }
      .btn-3d-cyan:active { transform: translateY(3px); box-shadow: inset 0 1px 0 rgba(255,255,255,.55), 0 1px 0 #0a6d88, 0 4px 8px rgba(34,211,238,.25); }
      .btn-3d-green {
        color: #06281a;
        background: linear-gradient(180deg, #5eeea0 0%, #25d366 45%, #1cb457 100%);
        box-shadow: inset 0 1px 0 rgba(255,255,255,.5), inset 0 -1px 0 rgba(0,0,0,.12), 0 4px 0 #0f7a3c, 0 10px 18px rgba(37,211,102,.25);
      }
      .btn-3d-green:active { transform: translateY(3px); box-shadow: inset 0 1px 0 rgba(255,255,255,.5), 0 1px 0 #0f7a3c, 0 4px 8px rgba(37,211,102,.22); }
      .inset-3d {
        background: #081120; border: 1px solid #1d2c47;
        box-shadow: inset 0 3px 8px rgba(0,0,0,.55), inset 0 -1px 0 rgba(255,255,255,.05);
      }
      .plan-3d {
        background: linear-gradient(180deg, #16263f 0%, #101d33 100%);
        border: 1px solid #2a4066;
        box-shadow: inset 0 1px 0 rgba(255,255,255,.07), 0 4px 10px rgba(0,0,0,.3);
      }
      .plan-3d-active {
        background: linear-gradient(180deg, rgba(34,211,238,.22) 0%, rgba(34,211,238,.08) 100%);
        border-color: var(--accent);
        box-shadow: inset 0 1px 0 rgba(255,255,255,.15), 0 4px 14px rgba(34,211,238,.25);
      }
      .radio-3d {
        background: linear-gradient(180deg, #7deefc 0%, #22d3ee 100%);
        box-shadow: inset 0 1px 0 rgba(255,255,255,.5), 0 2px 5px rgba(34,211,238,.4);
      }
      .pill-3d {
        background: linear-gradient(180deg, #16263f 0%, #0e1930 100%);
        border: 1px solid #2a4066;
        box-shadow: inset 0 1px 0 rgba(255,255,255,.07), 0 3px 8px rgba(0,0,0,.3);
      }
      .icon-3d {
        background: linear-gradient(160deg, #1d3357 0%, #0e1c33 100%);
        border: 1px solid #33507f;
        box-shadow: inset 0 1px 0 rgba(255,255,255,.14), inset 0 -2px 4px rgba(0,0,0,.35), 0 5px 10px rgba(0,0,0,.35);
      }
      .avatar-3d { box-shadow: 0 8px 18px rgba(0,0,0,.5), 0 0 0 3px rgba(34,211,238,.25), 0 0 22px rgba(34,211,238,.30); }
      .logo-3d { box-shadow: 0 6px 14px rgba(0,0,0,.5), 0 0 0 2px rgba(34,211,238,.35), 0 0 16px rgba(34,211,238,.35); }
      .badge-3d {
        background: linear-gradient(180deg, rgba(34,211,238,.28) 0%, rgba(34,211,238,.10) 100%);
        box-shadow: inset 0 1px 0 rgba(255,255,255,.2), 0 3px 8px rgba(0,0,0,.3);
      }
      .header-3d { background: linear-gradient(180deg, #0e1a30 0%, rgba(6,11,22,.97) 100%); box-shadow: 0 6px 18px rgba(0,0,0,.45); }
      .nav-3d { background: linear-gradient(0deg, #0a1424 0%, #0d1930 100%); box-shadow: 0 -6px 18px rgba(0,0,0,.45); }
      .nav-icon-3d {
        display: flex; height: 2.25rem; width: 3rem; align-items: center; justify-content: center; border-radius: 9999px;
        background: linear-gradient(180deg, #155e75 0%, #0e7490 100%);
        border: 1px solid rgba(103,232,249,.4);
        box-shadow: inset 0 1px 0 rgba(255,255,255,.25), 0 4px 10px rgba(34,211,238,.35);
      }
      .modal-3d { box-shadow: 0 -12px 40px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.08); }
      .input-3d { box-shadow: inset 0 2px 5px rgba(0,0,0,.45), inset 0 -1px 0 rgba(255,255,255,.04); }
      @keyframes sheet-up { from { transform: translateY(24px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
      .sheet-up { animation: sheet-up .22s ease-out; }
      @keyframes floaty { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
      @media (prefers-reduced-motion: no-preference) { .floaty { animation: floaty 4s ease-in-out infinite; } }
      @media (prefers-reduced-motion: reduce) { .sheet-up { animation: none; } }
      @media (hover: hover) and (prefers-reduced-motion: no-preference) {
        .tilt-3d { transition: transform .25s ease; }
        .tilt-3d:hover { transform: perspective(900px) rotateX(2.5deg) translateY(-3px); }
      }

      /* ---------- Chrome ---------- */
      header.site {
        position: sticky; top: 0; z-index: 40; border-bottom: 1px solid var(--border);
        padding-top: env(safe-area-inset-top);
      }
      .header-in { display: flex; align-items: center; justify-content: space-between; gap: .5rem; padding-top: .625rem; padding-bottom: .625rem; }
      .brand { display: flex; align-items: center; gap: .5rem; min-width: 0; }
      .brand img { height: 2.5rem; width: 2.5rem; border-radius: 9999px; object-fit: cover; flex-shrink: 0; }
      .brand-name { display: flex; align-items: center; gap: .25rem; font-family: var(--font-display); font-size: 1rem; font-weight: 800; line-height: 1.2; margin: 0; }
      .brand-sub { font-size: 11px; color: var(--dim); margin: 0; }
      .header-actions { display: flex; align-items: center; gap: .375rem; }
      .round-btn { display: flex; height: 2.5rem; width: 2.5rem; align-items: center; justify-content: center; border-radius: 9999px; flex-shrink: 0; }
      nav.bottom {
        position: fixed; left: 0; right: 0; bottom: 0; z-index: 40; border-top: 1px solid var(--border);
        padding-bottom: env(safe-area-inset-bottom);
      }
      .nav-grid { display: grid; grid-template-columns: repeat(5, 1fr); }
      .nav-item { display: flex; min-height: 3.5rem; flex-direction: column; align-items: center; justify-content: center; gap: 2px; padding: 0 .25rem; color: var(--dim); text-decoration: none; }
      .nav-item.active { color: var(--accent); }
      .nav-item .ni { display: flex; height: 2.25rem; width: 3rem; align-items: center; justify-content: center; }
      .nav-item .nl { font-size: 10px; font-weight: 600; line-height: 1.15; text-align: center; }
      .nav-item.wa { color: #25d366; }
      svg.ic { display: block; }

      /* ---------- Sections ---------- */
      .stack > * + * { margin-top: 1.25rem; }
      .hero { border-radius: var(--radius); padding: 1rem; }
      .hero-top { display: flex; align-items: center; gap: .75rem; }
      .avatar { border-radius: 9999px; overflow: hidden; border: 2px solid var(--accent); background: var(--surface-2); flex-shrink: 0; }
      .avatar img { height: 100%; width: 100%; object-fit: cover; display: block; }
      .hero h1 { font-family: var(--font-display); font-size: 1.25rem; font-weight: 800; line-height: 1.25; margin: 0; }
      .hero .sub { margin-top: .25rem; font-size: .875rem; color: var(--dim); }
      .chips { margin-top: .75rem; display: flex; flex-wrap: wrap; gap: .375rem; }
      .chip { display: inline-flex; align-items: center; gap: .25rem; border-radius: 9999px; padding: .25rem .625rem; font-size: 11px; font-weight: 700; }
      .chip-c { background: rgba(34,211,238,.10); color: var(--accent); }
      .chip-g { background: rgba(16,185,129,.10); color: var(--accent-2); }
      .big-btn { margin-top: .75rem; min-height: 2.75rem; width: 100%; border-radius: .75rem; font-family: var(--font-display); font-size: .875rem; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: .5rem; text-decoration: none; padding: 0 .5rem; }
      h2.sec { font-family: var(--font-display); font-size: 1rem; font-weight: 700; margin: 0; }
      h2.page { font-family: var(--font-display); font-size: 1.125rem; font-weight: 700; margin: 0; }
      .trust { display: grid; grid-template-columns: repeat(3, 1fr); gap: .5rem; }
      .trust div { display: flex; flex-direction: column; align-items: center; gap: .375rem; border-radius: .75rem; padding: .75rem .25rem; text-align: center; }
      .trust .tic { display: flex; height: 2.25rem; width: 2.25rem; align-items: center; justify-content: center; border-radius: 9999px; color: var(--accent); }
      .trust span { font-size: 11px; font-weight: 600; line-height: 1.3; }
      .cat-list > * + * { margin-top: .625rem; }
      .cat-box { display: flex; width: 100%; align-items: center; gap: .75rem; border-radius: var(--radius); padding: 1rem; text-align: left; }
      .cat-box .med { display: flex; height: 3.5rem; width: 3.5rem; flex-shrink: 0; align-items: center; justify-content: center; border-radius: 1rem; color: #fff; }
      .cat-box .ct { display: block; font-family: var(--font-display); font-size: 1.125rem; font-weight: 700; line-height: 1.25; }
      .cat-box .cb { display: block; margin-top: 2px; font-size: .75rem; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .cat-box .cc { display: block; margin-top: .25rem; font-size: 11px; font-weight: 700; color: var(--accent); }
      .cat-box .chev { flex-shrink: 0; color: var(--dim); transform: rotate(-90deg); }
      .sec-head { display: flex; align-items: center; justify-content: space-between; }
      .view-all { min-height: 2.25rem; padding: 0 .25rem; font-size: .875rem; font-weight: 700; color: var(--accent); }

      /* ---------- Product cards (square boxes) ---------- */
      .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: .75rem; margin-top: .75rem; }
      @media (min-width: 640px) { .grid { grid-template-columns: repeat(3, 1fr); } }
      .pcard { display: flex; height: 100%; flex-direction: column; border-radius: var(--radius); padding: .75rem; }
      .pcard-top { display: flex; align-items: flex-start; justify-content: space-between; gap: .5rem; }
      .medallion { display: flex; height: 3.5rem; width: 3.5rem; flex-shrink: 0; align-items: center; justify-content: center; border-radius: 1rem; color: #fff; }
      .pbadge { flex-shrink: 0; border-radius: 9999px; border: 1px solid rgba(34,211,238,.4); padding: .25rem .375rem; font-size: 10px; font-weight: 700; color: var(--accent); text-align: right; }
      .pbadge.oos { border-color: rgba(248,113,113,.5); background: rgba(239,68,68,.15); color: #fca5a5; box-shadow: none; }
      .pcard h3 { margin: .625rem 0 0; font-family: var(--font-display); font-size: 1rem; font-weight: 700; line-height: 1.35; }
      .tagline { margin-top: 2px; font-size: .75rem; color: var(--dim); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
      .tier-toggle { margin-top: .75rem; display: grid; grid-template-columns: 1fr 1fr; gap: .25rem; border-radius: .75rem; padding: .25rem; }
      .tier-toggle button { border-radius: .5rem; font-family: var(--font-display); font-size: .75rem; font-weight: 700; text-transform: capitalize; color: var(--dim); min-height: 2.25rem; }
      .tier-toggle button.on { color: #04222b; }
      .plans { margin-top: .75rem; display: flex; flex-direction: column; gap: .5rem; }
      .plan { display: flex; width: 100%; align-items: center; justify-content: space-between; gap: .25rem; border-radius: .75rem; padding: .5rem .45rem; text-align: left; }
      .plan:disabled { opacity: .6; cursor: not-allowed; }
      .plan .pl { display: flex; min-width: 0; align-items: center; gap: .25rem; font-size: 11px; font-weight: 500; }
      .plan .pl .lbl { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .radio { display: flex; height: .75rem; width: .75rem; flex-shrink: 0; align-items: center; justify-content: center; border-radius: 9999px; border: 1px solid var(--dim); color: #04222b; }
      .radio.on { border-color: var(--accent); }
      .plan .pp { flex-shrink: 0; font-family: var(--font-display); font-size: 11px; font-weight: 700; }
      .plan .pp.pending { font-size: 10.5px; color: var(--accent); text-align: right; white-space: normal; line-height: 1.2; }
      .pnote { margin-top: .625rem; font-size: 11px; color: var(--dim); }
      .pwarranty { margin-top: .375rem; display: flex; align-items: flex-start; gap: .375rem; font-size: 11px; color: var(--accent-2); }
      .pwarranty svg { margin-top: 1px; flex-shrink: 0; }
      .pcard .grow { margin-top: auto; }
      .oos-btn { margin-top: .75rem; display: flex; min-height: 2.75rem; width: 100%; align-items: center; justify-content: center; border-radius: .75rem; border: 1px solid rgba(248,113,113,.4); background: rgba(239,68,68,.10); font-family: var(--font-display); font-size: .875rem; font-weight: 700; color: #fca5a5; cursor: not-allowed; }

      /* ---------- Store tabs ---------- */
      .tabs { margin-top: .75rem; display: flex; gap: .375rem; overflow-x: auto; padding-bottom: .25rem; scrollbar-width: none; }
      .tabs::-webkit-scrollbar { display: none; }
      .tab { flex-shrink: 0; border-radius: 9999px; padding: 0 .875rem; font-family: var(--font-display); font-size: .75rem; font-weight: 700; color: var(--dim); min-height: 2.25rem; }
      .tab.on { color: #04222b; }
      .foot-note { margin-top: 1rem; text-align: center; font-size: .75rem; color: var(--dim); }

      /* ---------- Services / FAQ / misc cards ---------- */
      .svc-list > * + *, .faq-list > * + *, .steps > * + * { margin-top: .75rem; }
      .svc { border-radius: var(--radius); padding: 1rem; }
      .svc h3 { margin: 0; font-family: var(--font-display); font-size: 1.125rem; font-weight: 700; line-height: 1.35; }
      .svc p { margin-top: .25rem; font-size: .875rem; color: var(--dim); }
      .svc ul { margin: .75rem 0 0; padding: 0; list-style: none; }
      .svc li { display: flex; align-items: flex-start; gap: .5rem; font-size: .875rem; margin-top: .375rem; }
      .svc li svg { margin-top: 2px; color: var(--accent-2); flex-shrink: 0; }
      .founder { border-radius: var(--radius); padding: 1rem; }
      .founder .row { display: flex; align-items: center; gap: .75rem; }
      .warranty-tile { margin-top: .75rem; display: flex; align-items: flex-start; gap: .5rem; border-radius: .75rem; padding: .625rem .75rem; font-size: .875rem; }
      .warranty-tile svg { margin-top: 2px; color: var(--accent-2); flex-shrink: 0; }
      .step { display: flex; gap: .75rem; border-radius: .75rem; padding: .625rem .75rem; align-items: flex-start; }
      .step .n { display: flex; height: 1.75rem; width: 1.75rem; flex-shrink: 0; align-items: center; justify-content: center; border-radius: 9999px; font-family: var(--font-display); font-size: .875rem; font-weight: 700; }
      .step .t { font-size: .875rem; font-weight: 600; }
      .step .b { font-size: .75rem; color: var(--dim); }
      .faq-item { border-radius: .75rem; overflow: hidden; }
      .faq-q { display: flex; width: 100%; align-items: center; justify-content: space-between; gap: .5rem; padding: .625rem .75rem; text-align: left; min-height: 2.75rem; }
      .faq-q span { font-size: .875rem; font-weight: 600; }
      .faq-q svg { flex-shrink: 0; color: var(--dim); transition: transform .2s ease; }
      .faq-item.open .faq-q svg { transform: rotate(180deg); }
      .faq-a { padding: 0 .75rem .75rem; font-size: .875rem; color: var(--dim); margin: 0; }
      .policy { border-radius: var(--radius); padding: 1rem; }
      .policy ul { margin: .5rem 0 0; padding: 0; list-style: none; font-size: .875rem; color: var(--dim); }
      .policy li { margin-top: .375rem; }
      .policy li b { color: var(--text); font-weight: 600; }
      .about-p { margin-top: .75rem; font-size: .875rem; color: var(--dim); }
      .page-sub { margin-top: .25rem; font-size: .875rem; color: var(--dim); }

      /* ---------- Checkout modal ---------- */
      .overlay { position: fixed; inset: 0; z-index: 50; display: flex; align-items: flex-end; justify-content: center; background: rgba(0,0,0,.7); }
      @media (min-width: 640px) { .overlay { align-items: center; padding: 1rem; } }
      .sheet { width: 100%; max-width: 28rem; max-height: 92vh; overflow-y: auto; border-radius: 1.5rem 1.5rem 0 0; padding: 1rem; padding-bottom: calc(1rem + env(safe-area-inset-bottom)); }
      @media (min-width: 640px) { .sheet { border-radius: 1.5rem; } }
      .sheet-head { display: flex; align-items: flex-start; justify-content: space-between; gap: .5rem; }
      .sheet h2 { margin: 0; font-family: var(--font-display); font-size: 1.125rem; font-weight: 700; }
      .sheet .prod { font-size: .875rem; color: var(--dim); }
      .close-btn { display: flex; height: 2.25rem; width: 2.25rem; align-items: center; justify-content: center; border-radius: 9999px; flex-shrink: 0; }
      .total-row { margin-top: .75rem; display: flex; align-items: center; justify-content: space-between; border-radius: .75rem; padding: .625rem .75rem; }
      .total-row .tl { font-size: .875rem; color: var(--dim); }
      .total-row .tv { font-family: var(--font-display); font-size: 1.125rem; font-weight: 700; color: var(--accent); }
      .sheet .warr { margin-top: .375rem; display: flex; align-items: center; gap: .375rem; font-size: .75rem; color: var(--accent-2); }
      .sheet h3 { margin: 1rem 0 0; font-family: var(--font-display); font-size: .875rem; font-weight: 700; }
      .pay-list > * + * { margin-top: .5rem; }
      .pay-list { margin-top: .5rem; }
      .pay-row { border-radius: .75rem; padding: .625rem .75rem; }
      .pay-row .pr-head { display: flex; align-items: center; justify-content: space-between; gap: .5rem; }
      .pay-row .pr-title { font-family: var(--font-display); font-size: .875rem; font-weight: 700; }
      .copy-btn { display: flex; align-items: center; gap: .25rem; border-radius: .5rem; border: 1px solid var(--border); padding: 0 .5rem; font-size: .75rem; font-weight: 600; color: var(--accent); min-height: 2rem; }
      .pay-num { margin-top: .25rem; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 1rem; letter-spacing: .02em; }
      .pay-name, .pay-empty { font-size: .75rem; color: var(--dim); }
      .pay-empty { margin-top: .25rem; }
      .shot-note { margin-top: .5rem; display: flex; align-items: flex-start; gap: .5rem; border-radius: .75rem; border: 1px solid rgba(16,185,129,.4); background: rgba(16,185,129,.10); padding: .625rem .75rem; font-size: .875rem; }
      .shot-note svg { margin-top: 2px; flex-shrink: 0; color: var(--accent-2); }
      .shot-note .dim { color: var(--dim); }
      .form > * + * { margin-top: .5rem; }
      .form { margin-top: .5rem; }
      .form label { font-size: .75rem; font-weight: 600; color: var(--dim); display: block; }
      .form input, .form select {
        margin-top: .25rem; width: 100%; border-radius: .75rem; border: 1px solid var(--border);
        background: var(--surface-2); padding: .5rem .75rem; font-size: .875rem; color: var(--text); outline: none; font-family: inherit;

      }

      function render() {
        if (state.tab === "home") app.innerHTML = homeView();
        else if (state.tab === "store") app.innerHTML = storeView();
        else if (state.tab === "services") app.innerHTML = servicesView();
        else app.innerHTML = faqView();
        document.querySelectorAll(".nav-item[data-tab]").forEach(function (btn) {
          var on = btn.getAttribute("data-tab") === state.tab;
          btn.classList.toggle("active", on);
          var ni = btn.querySelector("[data-ni]");
          if (ni) ni.className = on ? "nav-icon-3d" : "ni";
          if (on) btn.setAttribute("aria-current", "page"); else btn.removeAttribute("aria-current");
        });
      }

      function goStore(cat) { state.category = cat; state.tab = "store"; render(); window.scrollTo(0, 0); }

      /* ---------------- Checkout ---------------- */
      function paymentRow(title, name, number, emptyText) {
        var has = number && number.trim().length > 0;
        var h = '<div class="pay-row tile-3d"><div class="pr-head"><p class="pr-title" style="margin:0">' + esc(title) + '</p>';
        if (has) h += '<button type="button" class="copy-btn" data-copy="' + esc(number) + '">' + icon(P.copy, 14) + '<span>Copy</span></button>';
        h += '</div>';
        if (has) {
          h += '<p class="pay-num">' + esc(number) + '</p>';
          if (name) h += '<p class="pay-name">Account title: ' + esc(name) + '</p>';
        } else {
          h += '<p class="pay-empty">' + esc(emptyText || "Account details are shared on WhatsApp when you send your order.") + '</p>';
        }
        return h + '</div>';
      }

      function openCheckout(product, plan) {
        var needsEmail = product.slug === "canva-pro";
        var planName = planDisplayName(product, plan);
        var h = '<div class="overlay" id="coOverlay" role="dialog" aria-modal="true" aria-label="Checkout — ' + esc(product.name) + '">' +
          '<div class="sheet sheet-up card-3d modal-3d" id="coSheet">' +
          '<div class="sheet-head"><div><h2>Checkout</h2><p class="prod" style="margin:2px 0 0">' + esc(product.name) + ' · ' + esc(planName) + '</p></div>' +
          '<button type="button" class="close-btn icon-3d" id="coClose" aria-label="Close checkout">' + icon(P.close, 16) + '</button></div>' +
          '<div class="total-row inset-3d"><span class="tl">Total to pay</span><span class="tv">' + rs(plan.price) + '</span></div>' +
          '<p class="warr">' + icon(P.shield, 16) + esc(product.warranty) + '</p>' +
          '<h3>1 · Pay with any method</h3><div class="pay-list">' +
          paymentRow("EasyPaisa", SETTINGS.easypaisaTitle, SETTINGS.easypaisaNumber) +
          paymentRow("JazzCash", SETTINGS.jazzcashTitle, SETTINGS.jazzcashNumber) +
          paymentRow(SETTINGS.bankName ? "Bank · " + SETTINGS.bankName : "Bank Transfer", SETTINGS.bankTitle, SETTINGS.bankNumber, "Bank details coming soon — ask on WhatsApp.") +
          '</div>' +
          '<div class="shot-note">' + icon(P.camera, 20) + '<p style="margin:0"><span style="font-weight:600">Payment karne ke baad screenshot WhatsApp par bhej dein.</span> <span class="dim">Send your payment screenshot on WhatsApp after paying — your account is delivered once we see it.</span></p></div>' +
          '<h3>2 · Your details</h3><div class="form">' +
          '<div><label for="co-name">Your name</label><input id="co-name" type="text" placeholder="e.g. Ahmed Khan" autocomplete="name" /></div>' +
          '<div><label for="co-phone">Your WhatsApp number</label><input id="co-phone" type="tel" inputmode="tel" placeholder="03xx-xxxxxxx" autocomplete="tel" /></div>' +
          '<div><label for="co-email">Email' + (needsEmail ? " (required for Canva Pro activation)" : " (optional)") + '</label><input id="co-email" type="email" inputmode="email" placeholder="you@example.com" autocomplete="email" /><p class="err hidden" id="coEmailErr"></p></div>' +
          '<div><label for="co-method">I will pay via</label><select id="co-method"><option>EasyPaisa</option><option>JazzCash</option><option>Bank Transfer</option></select></div>' +
          '</div>' +
          '<h3>3 · Send your order</h3>' +
          '<button type="button" class="big-btn btn-3d btn-3d-green" id="coSend" style="min-height:3rem">' + icon(P.whatsapp, 20) + 'Send Order on WhatsApp</button>' +
          '<p class="fine">Your order opens in WhatsApp to ' + SETTINGS.whatsappDisplay + ' with everything filled in. Send the payment screenshot there to get your account.</p>' +
          '</div></div>';
        modalRoot.innerHTML = h;

        var overlay = document.getElementById("coOverlay");
        overlay.addEventListener("click", function (e) { if (e.target === overlay) closeModal(); });
        document.getElementById("coClose").addEventListener("click", closeModal);
        overlay.querySelectorAll("[data-copy]").forEach(function (btn) {
          btn.addEventListener("click", function () {
            var num = btn.getAttribute("data-copy");
            var label = btn.querySelector("span");
            function done() { if (label) { label.textContent = "Copied"; setTimeout(function () { label.textContent = "Copy"; }, 1600); } }
            if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(num).then(done, done);
            else done();
          });
        });
        document.getElementById("coSend").addEventListener("click", function () {
          var name = document.getElementById("co-name").value.trim();
          var phone = document.getElementById("co-phone").value.trim();
          var email = document.getElementById("co-email").value.trim();
          var method = document.getElementById("co-method").value;
          var err = document.getElementById("coEmailErr");
          if (needsEmail) {
            var ok = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
            if (!ok) {
              err.textContent = "Canva Pro is activated on your personal email — please enter a valid email.";
              err.classList.remove("hidden");
              return;
            }
          }
          err.classList.add("hidden");
          var lines = [
            "New Order — AI Tools Hubb", "",
            "Product: " + product.name,
            "Plan: " + planName,
            "Price: " + rs(plan.price),
            "Warranty: " + product.warranty
          ];
          if (name) lines.push("Name: " + name);
          if (phone) lines.push("My WhatsApp: " + phone);
          if (email) lines.push("Email: " + email);
          lines.push("Payment method: " + method);
          lines.push("", "I will send the payment screenshot here. Please confirm my order.");
          window.open(waLink(lines.join("\n")), "_blank");
        });
      }

      function openAdminNote() {
        modalRoot.innerHTML =
          '<div class="overlay" id="adOverlay" role="dialog" aria-modal="true" aria-label="Admin panel">' +
          '<div class="sheet sheet-up card-3d modal-3d" style="text-align:center">' +
          '<div class="avatar" style="height:3rem;width:3rem;margin:0 auto;display:flex;align-items:center;justify-content:center;color:var(--accent);border:none;background:linear-gradient(160deg,#1d3357,#0e1c33)">' + icon(P.shield, 24) + '</div>' +
          '<h2 style="margin-top:.75rem">Admin Panel</h2>' +
          '<p style="margin:.25rem 0 0;font-size:.875rem;color:var(--dim)">Prices, products and orders for this store are managed by the owner. Customers can order right here — every order goes straight to WhatsApp ' + SETTINGS.whatsappDisplay + '.</p>' +
          '<a class="big-btn btn-3d btn-3d-green" href="' + waLink("Assalam-o-Alaikum! I need help with AI Tools Hubb. Please guide me.") + '" target="_blank" rel="noreferrer">' + icon(P.whatsapp, 20) + 'WhatsApp Support</a>' +
          '<button type="button" class="big-btn pill-3d" id="adClose" style="color:var(--dim)">Close</button>' +
          '</div></div>';
        var overlay = document.getElementById("adOverlay");
        overlay.addEventListener("click", function (e) { if (e.target === overlay) closeModal(); });
        document.getElementById("adClose").addEventListener("click", closeModal);
      }

      function closeModal() { modalRoot.innerHTML = ""; }
      document.addEventListener("keydown", function (e) { if (e.key === "Escape") closeModal(); });

      /* ---------------- Events ---------------- */
      var supportLink = waLink("Assalam-o-Alaikum! I need help with AI Tools Hubb. Please guide me.");
      document.getElementById("headerWa").href = supportLink;
      document.getElementById("navWa").href = supportLink;
      document.getElementById("adminBtn").addEventListener("click", openAdminNote);

      document.querySelectorAll(".nav-item[data-tab]").forEach(function (btn) {
        btn.addEventListener("click", function () {
          state.tab = btn.getAttribute("data-tab");
          render();
          window.scrollTo(0, 0);
        });
      });

      app.addEventListener("click", function (e) {
        var t0 = e.target;
        function closest(sel) { var n = t0; while (n && n !== app) { if (n.matches && n.matches(sel)) return n; n = n.parentNode; } return null; }
        var el;
        if ((el = closest("[data-gostore]"))) { goStore(el.getAttribute("data-gostore")); return; }
        if ((el = closest("[data-goto]"))) { state.tab = el.getAttribute("data-goto"); render(); window.scrollTo(0, 0); return; }
        if ((el = closest("[data-cat]"))) { state.category = el.getAttribute("data-cat"); render(); window.scrollTo(0, 0); return; }
        if ((el = closest("[data-tier]"))) {
          var cs = getCardState(PRODUCTS.find(function (p) { return p.slug === el.getAttribute("data-slug"); }));
          cs.tier = el.getAttribute("data-tier"); cs.selectedKey = null; render(); return;
        }
        if ((el = closest("[data-plan]"))) {
          var cs2 = getCardState(PRODUCTS.find(function (p) { return p.slug === el.getAttribute("data-slug"); }));
          cs2.selectedKey = el.getAttribute("data-plan"); render(); return;
        }
        if ((el = closest("[data-buy]"))) {
          var product = PRODUCTS.find(function (p) { return p.slug === el.getAttribute("data-buy"); });
          var plan = activePlan(product);
          if (product && plan) openCheckout(product, plan);
          return;
        }
        if ((el = closest("[data-faq]"))) {
          var i = Number(el.getAttribute("data-faq"));
          state.faqOpen = state.faqOpen === i ? null : i;
          render(); return;
        }
      });

      render();
    </script>
  </body>
</html>
